<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; font-family:'Segoe UI', Arial, sans-serif; }
  .canvas {
    width:1920px; height:1080px;
    position:relative;
    background: #ffffff;
  }
  .border-frame {
    position:absolute; inset:22px;
    border:1px solid rgba(11,59,96,0.16);
    border-radius:26px;
  }
  .glow-blue {
    position:absolute; top:-200px; right:-200px; width:620px; height:620px;
    border-radius:999px;
    background: radial-gradient(circle, rgba(11,59,96,0.09) 0%, rgba(11,59,96,0) 70%);
  }
  .glow-gold {
    position:absolute; bottom:-200px; left:-200px; width:620px; height:620px;
    border-radius:999px;
    background: radial-gradient(circle, rgba(212,175,55,0.13) 0%, rgba(212,175,55,0) 70%);
  }

  .el { position:absolute; left:0; right:0; text-align:center; }

  /* Same seven elements and the same vertical rhythm as outro_master.html,
     re-flowed for a 1920x1080 canvas: the stack is centred on the canvas's
     midline (182px of air above the logo and below the contact block) so the
     end card reads as the portrait one's sibling, not a squashed copy. */
  #logo { top:182px; display:flex; justify-content:center; }
  #logo img { width:190px; height:190px; object-fit:contain; }

  #name { top:390px; font-size:66px; font-weight:800; color:#0B3B60; letter-spacing:0.01em; }

  #tag { top:478px; font-size:21px; font-weight:700; letter-spacing:0.14em; color:#D4AF37; text-transform:uppercase; }

  #divider { top:528px; display:flex; align-items:center; justify-content:center; gap:16px; }
  #divider .bar { width:70px; height:3px; background:#D4AF37; border-radius:2px; }
  #divider .dot { width:9px; height:9px; border-radius:999px; background:#0B3B60; }

  #cta-eyebrow { top:592px; font-size:24px; font-weight:700; color:#334155; letter-spacing:0.01em; }

  #cta-button { top:638px; display:flex; justify-content:center; }
  #cta-button .pill {
    display:inline-flex; align-items:center; gap:14px;
    background:#D4AF37;
    color:#0B3B60;
    font-size:34px; font-weight:800; letter-spacing:0.01em;
    padding:24px 48px;
    border-radius:999px;
    box-shadow: 0 18px 34px -12px rgba(212,175,55,0.55);
  }
  #cta-button .pill .arrow { font-size:30px; font-weight:800; }

  #contact { top:778px; }
  #contact .divider2 { width:120px; height:3px; background:#0B3B60; opacity:0.18; margin:0 auto 30px; border-radius:2px; }
  #contact .domain { font-size:46px; font-weight:800; color:#0B3B60; letter-spacing:0.02em; }
  #contact .row { margin-top:18px; font-size:23px; font-weight:600; color:#64748b; letter-spacing:0.01em; }
  #contact .row span.sep { color:#D4AF37; margin:0 14px; }
</style></head>
<body>
  <div class="canvas">
    <div class="glow-blue"></div>
    <div class="glow-gold"></div>
    <div class="border-frame"></div>

    <div id="logo" class="el"><img src="file:///__LOGO_MARK_PATH__" /></div>
    <div id="name" class="el">GUÉDÉ TECH</div>
    <div id="tag" class="el">Bâtissons votre avenir numérique</div>
    <div id="divider" class="el">
      <div class="bar"></div><div class="dot"></div><div class="bar"></div>
    </div>
    <div id="cta-eyebrow" class="el">Un projet en tête&nbsp;?</div>
    <div id="cta-button" class="el">
      <div class="pill">Contactez-nous <span class="arrow">&#8594;</span></div>
    </div>
    <div id="contact" class="el">
      <div class="divider2"></div>
      <div class="domain">guedetech.com</div>
      <div class="row">+221 70 920 45 70 <span class="sep">&#183;</span> guedetech@gmail.com</div>
    </div>
  </div>
</body></html>
